[package]
name = "kizunasync-db"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Turso local database execution and persistence for the Kizuna engine"
publish = false

[dependencies]
turso = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
fs2 = "0.4"
sha2 = { workspace = true }
hex = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
turso_core = { version = "=0.8.3", default-features = false, features = ["fs"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1.1.0"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[package]
name = "kizunasync-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UniFFI surface over kizunasync-engine (Swift/Kotlin)"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "kizunasync_ffi"

[dependencies]
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
kizunasync-engine = { path = "../kizunasync-engine" }
kizunasync-store = { path = "../kizunasync-store" }
kizunasync-query = { path = "../kizunasync-query" }
kizunasync-protocol = { path = "../kizunasync-protocol" }
# UniFFI 0.31.x matches ubrn 0.31.0-6. Do not bump to 0.32. No `cli` feature:
# only kizunasync-bindgen calls uniffi_bindgen_main().
uniffi = { version = "0.31.2" }

# Live PostgREST remote: enabled by the `http` feature (native packaging turns it on).
# Native-only: it is built on reqwest with the rustls TLS stack, which does not
# apply to wasm32, where the browser owns the transport.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kizunasync-remote-http = { path = "../kizunasync-remote-http", optional = true }

[features]
default = []
http = ["dep:kizunasync-remote-http"]

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

// Based on the uniffi-bindgen-react-native template; ubrn.config.yaml lists it under noOverwrite so ubrn keeps these edits.

buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["DummyLibForAndroid_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

// com.kizunasync:kizunasync-engine ships these three ABIs.
def engineAbis() {
  return ["arm64-v8a", "armeabi-v7a", "x86_64"].intersect(reactNativeArchitectures() as List)
}

// `bun run ubrn:android` writes the engine here in the monorepo; AGP packages src/main/jniLibs by default.
def hasLocalEngine() {
  return engineAbis().any { abi -> file("src/main/jniLibs/${abi}/libkizunasync_ffi.so").isFile() }
}

def kizunasyncVersion() {
  return new groovy.json.JsonSlurper().parse(file("../package.json")).version
}

def localEngine = hasLocalEngine()
def engineLibDir = localEngine ? file("src/main/jniLibs") : layout.buildDirectory.dir("kizunasync-engine/jni").get().asFile

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["RnUniffi_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["RnUniffi_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.kizunasync.rnuniffi"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifest.xml"
      }
    }
  }

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    consumerProguardFiles 'proguard-rules.pro'

    buildFeatures {
      prefab true
    }
    externalNativeBuild {
      cmake {
        arguments '-DANDROID_STL=c++_shared', "-DKIZUNASYNC_ENGINE_LIB_DIR=${engineLibDir.absolutePath}"
        abiFilters (*engineAbis())
      }
    }
    ndk {
      abiFilters (*engineAbis())
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}

if (!localEngine) {
  configurations {
    kizunasyncEngineAar
  }

  dependencies {
    implementation "com.kizunasync:kizunasync-engine:${kizunasyncVersion()}"
    kizunasyncEngineAar "com.kizunasync:kizunasync-engine:${kizunasyncVersion()}@aar"
  }

  // The app packages the engine from the implementation dependency above, so this copy only feeds the linker.
  def extractKizunaSyncEngine = tasks.register("extractKizunaSyncEngine", Copy) {
    from({ zipTree(configurations.kizunasyncEngineAar.singleFile) }) {
      include "jni/*/libkizunasync_ffi.so"
    }
    into engineLibDir.parentFile
  }

  tasks.configureEach { task ->
    if (task.name.startsWith("configureCMake")) {
      task.dependsOn extractKizunaSyncEngine
    }
  }
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "RnUniffi"
    codegenJavaPackageName = "com.kizunasync.rnuniffi"
  }
}

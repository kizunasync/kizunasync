\* prop-002 no-lost-committed-change, bounded safety and liveness model with
\* TEETH. NTxns = 3 transactions draw numbers from one counter when they
\* commit (commit-time numbering, the D-visibility-horizon design), and an
\* abort may consume a number it never commits. TLC checks that every committed
\* number at or below the cursor is delivered, that an aborted number is never
\* delivered, and that every committed number is eventually delivered. The
\* module header records the write-time variant and the `Delivered` lasso TLC
\* prints for it, proving the model actively hunts the lost write, unlike the
\* prop-001/003/005 positive abstractions.
\*
\* The overlap-window variant (arrived_at + overlap re-scan) is the documented
\* rejected alternative and is NOT modelled here.
SPECIFICATION Spec
CONSTANT
  NTxns = 3
INVARIANT TypeOK
INVARIANT CursorCoversDelivered
INVARIANT AbortDeliversNothing
PROPERTY Delivered

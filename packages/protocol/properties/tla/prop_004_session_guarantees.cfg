\* prop-004 session guarantees, bounded model with TEETH.
\* MaxIssue = 3 gives write-ids 1/2/3 (issued in ascending order); this exercises
\* the interleavings of issue / apply-in-order / dead-letter / stale-read that the
\* four Terry guarantees constrain, including the dead-letter exception path and
\* the read-staleness that makes RYW/MR violations expressible (see module header
\* for the BROKEN-read and SILENT-drop counter-traces this honest model rules out).
SPECIFICATION Spec
CONSTANT MaxIssue = 3
INVARIANT TypeOK
INVARIANT ReadYourWrites
INVARIANT MonotonicReads
INVARIANT MonotonicWrites
INVARIANT WritesFollowReads

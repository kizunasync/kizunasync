\* prop-006 no-resurrection, bounded FUSION model, TLC green.
\* Ttl = 2, ExpiryHorizon = 2 (FUSED: ExpiryHorizon = Ttl), MaxOffline = 4. With
\* the boundaries fused the gap `Ttl < offline <= ExpiryHorizon` is unsatisfiable,
\* so every Resync lands in a SAFE regime: offline <= Ttl (tombstone rides the
\* pull) or offline > ExpiryHorizon (CHECKPOINT_EXPIRED re-hydration). MaxOffline=4
\* (> ExpiryHorizon) checks durations on BOTH sides of the boundary. Un-fusing to
\* ExpiryHorizon = Ttl + 1 = 3 opens the single-tick gap offline=3 and makes TLC
\* report a NoResurrection violation: the teeth recorded in the module header.
SPECIFICATION Spec
CONSTANTS
  Ttl = 2
  ExpiryHorizon = 2
  MaxOffline = 4
INVARIANT TypeOK
INVARIANT NoResurrection

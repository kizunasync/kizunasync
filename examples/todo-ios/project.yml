name: TodoIos
options:
  bundleIdPrefix: com.kizunasync
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
packages:
  TodoIos:
    path: .
  KizunaSync:
    path: ../../crates/kizunasync-ffi/bindings/swift
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.kizunasync.todo-ios
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: KizunaSync Todo
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  TodoIos:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: TodoIos
        product: TodoIosCore
      - package: KizunaSync
        product: KizunaSync
    settings:
      base:
        PRODUCT_NAME: TodoIos
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        DEVELOPMENT_TEAM: ""

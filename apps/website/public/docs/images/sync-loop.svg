<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" width="1440" height="810" fill="none" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Write locally. Push. Pull. Reads and writes hit local SQLite; the outbox pushes, the server answers with a verdict, and a fenced pull moves the checkpoint.</title>
  <desc id="dsc">Sarah's phone shows a todo list read from local SQLite, an empty outbox, and a checkpoint at seq 41. Your Supabase project, on the right, lists kizunasync.push, kizunasync.pull, and the todos table under RLS. Sarah adds the todo "works on a plane". The row appears in her list at once, and an insert slip drops into the outbox, whose count goes from 0 to 1. The slip rides the wire to kizunasync.push, the todos RLS row checks the write, and a chip reading "applied" rides back, so the outbox count returns to 0. A pull chip carrying 2 changes follows it: David renamed "Buy milk" to "Buy oat milk", the list shows the new title, and the checkpoint moves from seq 41 to seq 43. The list then returns to rest and the loop starts again.</desc>
  <style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>

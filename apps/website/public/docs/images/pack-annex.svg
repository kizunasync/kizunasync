<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" width="1440" height="810" fill="none" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">What kizunasync init installs: a kizunasync schema beside your public tables and two triggers on each synced table.</title>
  <desc id="dsc">Kizuna installs one schema beside yours. On the left, the public schema of your database holds todos and profiles. The todos table is synced, so it carries two trigger badges, track_change and track_delete, and the profiles table carries none. Below them, a Realtime card shows the kizunasync:todos topic. On the right, the kizunasync schema card shows the kizunasync_rls role, which is NOBYPASSRLS, the five public RPCs pull, push, attachment_confirm, attachment_metadata, and attachment_vacuum, its fourteen tables, and the three retention jobs kizunasync-reap-tombstones, kizunasync-compact-changelog, and kizunasync-prune-clients. A highlighted lane runs from _change_pending through _stamp_transaction, marked at commit, to _changelog. In the loop, an insert lands in todos, track_change fires, and a pulse carries the change into _change_pending, whose count goes from 0 to 1 while the transaction is open. At commit, _stamp_transaction numbers the change: the chip turns from upsert · todos into seq 4 · todos, the pending count returns to 0, and the chip moves into _changelog. Realtime then rings on kizunasync:todos. Next, a deprovision --purge tag appears and the kizunasync schema fades out together with the two triggers, while todos, its new row, and profiles stay in place. The schema and the triggers fade back in, the new row clears, and the loop repeats.</desc>

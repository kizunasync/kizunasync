name: release-swift

on:
  workflow_call:
    inputs:
      version:
        description: >
          Version to release, without the "v" prefix.
          This must match an existing "v<version>" tag.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: >
          Version to release, without the "v" prefix.
          This must match an existing "v<version>" tag.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-swift-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.2

jobs:
  swift-package:
    name: swift package · XCFramework + kizunasync/kizunasync-swift
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve release version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          VERSION="$VERSION_INPUT"

          # Check version formatting
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: version '$VERSION' does not match X.Y.Z or X.Y.Z-prerelease" >&2
            exit 1
          fi

          # Read versions from Cargo.toml and package.json
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          # Check that all versions agree
          if [[ "$VERSION" != "$CARGO_VERSION" ]]; then
            echo "error: tag version '$VERSION' does not match root Cargo.toml [workspace.package].version '$CARGO_VERSION'" >&2
            exit 1
          fi

          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "error: tag version '$VERSION' does not match root package.json version '$PACKAGE_VERSION'" >&2
            exit 1
          fi

          # Export
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: kizunasync-workspace
          cache-on-failure: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies for root and all Bun workspaces
        run: bun install --frozen-lockfile

      - name: Check Rust bindgen outputs with Bun
        run: bun run cargo:bindgen:check

      - name: Build XCFramework and create zip release
        run: bash scripts/build-xcframework.sh --zip dist/KizunaSyncFfi.xcframework.zip

      # The release and its assets should already be available before tagging the Swift package, 
      # so SwiftPM consumers can fetch the release immediately when the tag lands. 
      - name: Ensure GitHub Release exists and upload XCFramework assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          # Use prerelease flag if version is 0.x.*
          if [[ "$VERSION" == 0.* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Create the release if it does not exist, or update it otherwise
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi
          gh release upload "v$VERSION" \
            dist/KizunaSyncFfi.xcframework.zip \
            dist/KizunaSyncFfi.xcframework.zip.checksum \
            --clobber

      - name: Checkout kizunasync/kizunasync-swift for package update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: kizunasync/kizunasync-swift
          ref: main
          path: dist/kizunasync-swift
          ssh-key: ${{ secrets.KSYNC_SWIFT_DEPLOY_KEY }}
          persist-credentials: true

      - name: Sync generated Swift package
        run: |
          bash scripts/sync-swift-package.sh dist/kizunasync-swift \
            --version "$VERSION" \
            --checksum "$(cat dist/KizunaSyncFfi.xcframework.zip.checksum)"

      - name: Commit, tag, and push changes to Swift package
        working-directory: dist/kizunasync-swift
        run: |
          set -euo pipefail
          git config user.name "kizunasync-release"
          git config user.email "kizunasync@smartsquad.io"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Release $VERSION"
          fi
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin HEAD:main
          git push origin "$VERSION"

      - name: Upload KizunaSyncFfi.xcframework as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: KizunaSyncFfi.xcframework
          path: dist/KizunaSyncFfi.xcframework.zip
          retention-days: 14
